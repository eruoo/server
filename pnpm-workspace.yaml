minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
# 补丁行为证据与删除条件：docs/specs/implementation.md
peerDependencyRules:
  allowedVersions:
    "openapi-typescript>typescript": "6"
allowBuilds:
  esbuild: true
  simple-git-hooks: true
  vue-demi: true
  workerd: true
patchedDependencies:
  "@better-auth/api-key@1.7.2": patches/@better-auth__api-key@1.7.2.patch
  "@better-auth/oauth-provider@1.7.2": patches/@better-auth__oauth-provider@1.7.2.patch
