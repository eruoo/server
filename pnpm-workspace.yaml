minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
# 补丁行为证据与删除条件：docs/specs/implementation.md
peerDependencyRules:
  allowedVersions:
    "openapi-typescript>typescript": "6"
# 统一 jose：oauth-provider 自带 6.2.10 会与根的 6.2.12 形成双版本共存，
# 强制全部解析为根锁定的 6.2.12。
overrides:
  jose: 6.2.12
allowBuilds:
  esbuild: true
  simple-git-hooks: true
  vue-demi: true
  workerd: true
patchedDependencies:
  "@better-auth/api-key@1.7.2": patches/@better-auth__api-key@1.7.2.patch
  "@better-auth/oauth-provider@1.7.2": patches/@better-auth__oauth-provider@1.7.2.patch
