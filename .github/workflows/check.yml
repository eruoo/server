name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.18.0
          install: false

      - name: Verify toolchain
        run: |
          expected_pnpm_version="$(
            node -e 'const value = require("./package.json").packageManager; const match = /^pnpm@([^+]+)(?:\+.*)?$/u.exec(value); if (!match) process.exit(1); process.stdout.write(match[1])'
          )"
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "$expected_pnpm_version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check
        run: pnpm run check
